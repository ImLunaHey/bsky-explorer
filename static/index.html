<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Bluesky Observatory</title><style>
:root{color-scheme:dark;font:15px system-ui;background:#07111f;color:#dce8f8}body{max-width:1200px;margin:32px auto;padding:0 20px}h1{letter-spacing:-.04em}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.card{background:#101e31;border:1px solid #223a58;border-radius:12px;padding:18px;margin:14px 0}.num{font-size:2rem;color:#61dafb}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:9px;border-bottom:1px solid #223a58}a{color:#61dafb}small{color:#8da5c2}</style></head><body>
<h1>Bluesky Network Observatory</h1><small>Evidence-led signals; scores are not account labels.</small><div id="rates" class="grid"></div><div class="grid"><section class="card"><h2>Top domains</h2><div id="domains"></div></section><section class="card"><h2>Storage</h2><div id="storage"></div></section></div><section class="card"><h2>Active coordination clusters</h2><div id="clusters"></div></section>
<script>const f=async p=>(await fetch(p)).json(),fmt=n=>Intl.NumberFormat().format(Math.round(n));async function tick(){let [r,d,c,s]=await Promise.all([f('/api/stats'),f('/api/trending/domains'),f('/api/clusters'),f('/api/storage')]);rates.innerHTML=[['Events/s',r.events_per_sec],['Posts/s',r.posts_per_sec],['Likes/s',r.likes_per_sec],['Follows/s',r.follows_per_sec]].map(x=>`<div class=card><small>${x[0]}</small><div class=num>${x[1].toFixed(2)}</div></div>`).join('');domains.innerHTML=d.slice(0,10).map(x=>`<p>${x[0]} <b>${x[1]}</b></p>`).join('')||'Waiting for events…';storage.innerHTML=`Archive ${fmt(s.raw_archive_bytes)} B<br>ClickHouse ${fmt(s.clickhouse_bytes)} B<br>Projected/month ${fmt(s.projected_monthly_bytes)} B`;clusters.innerHTML=c.length?`<table><tr><th>Cluster</th><th>Accounts</th><th>Events</th><th>Score</th><th>Evidence</th></tr>${c.map(x=>`<tr><td>${x.cluster_id}</td><td>${x.accounts.length}</td><td>${x.event_count}</td><td>${x.scores.coordination_score.toFixed(2)}</td><td>${x.common_domains.join(', ')||x.common_targets.join(', ')}</td></tr>`).join('')}</table>`:'No active detections';}tick();setInterval(tick,3000)</script></body></html>
