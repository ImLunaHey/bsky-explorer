<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Bluesky Observatory</title><style>
:root{color-scheme:dark;font:15px system-ui;background:#07111f;color:#dce8f8}body{max-width:1300px;margin:32px auto;padding:0 20px}h1{letter-spacing:-.04em}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.card{background:#101e31;border:1px solid #223a58;border-radius:12px;padding:18px;margin:14px 0;overflow:auto}.num{font-size:2rem;color:#61dafb}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:9px;border-bottom:1px solid #223a58}a,button{color:#61dafb}button{background:none;border:0;padding:0;text-decoration:underline;cursor:pointer;font:inherit}small,.muted{color:#8da5c2}.bar{display:inline-block;background:#61dafb;height:8px;border-radius:4px;min-width:2px}.tag{display:inline-block;background:#223a58;border-radius:10px;padding:3px 7px;margin:2px}pre{white-space:pre-wrap}dialog{max-width:900px;width:85%;background:#101e31;color:#dce8f8;border:1px solid #44658b;border-radius:12px}dialog::backdrop{background:#000a}
</style></head><body>
<h1>Bluesky Network Observatory</h1><small>Evidence-led signals; scores indicate observable behaviour, not account identity.</small>
<div id="rates" class="grid"></div>
<div class="grid"><section class="card"><h2>Top domains</h2><div id="domains"></div></section><section class="card"><h2>Text fingerprints</h2><div id="fingerprints"></div></section><section class="card"><h2>Growing conversations</h2><div id="conversations"></div></section><section class="card"><h2>Storage</h2><div id="storage"></div></section></div>
<section class="card"><h2>Active coordination clusters</h2><div id="clusters"></div></section>
<div class="grid"><section class="card"><h2>Unusual posting behaviour</h2><div id="posting"></div></section><section class="card"><h2>Repeated-content campaigns</h2><div id="campaigns"></div></section></div>
<dialog id="detail"><button onclick="detail.close()">Close</button><div id="detailBody"></div></dialog>
<script>
const f=async p=>{const r=await fetch(p);if(!r.ok)throw Error(`${p}: ${r.status}`);return r.json()},fmt=n=>Intl.NumberFormat().format(Math.round(n)),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),empty=(a,s)=>a.length?a.join(''):s;
const clusterRows=c=>empty(c.map(x=>`<tr><td><button onclick="showCluster('${encodeURIComponent(x.cluster_id)}')">${esc(x.cluster_id)}</button></td><td>${x.accounts.length}</td><td>${x.event_count}</td><td>${x.scores.coordination_score.toFixed(2)}</td><td>${esc((x.common_domains.length?x.common_domains:x.common_targets).join(', '))}</td></tr>`),'No active detections');
async function showCluster(id){const x=await f('/api/clusters/'+id),max=Math.max(1,...x.timeline.map(b=>b.event_count));detailBody.innerHTML=`<h2>${esc(x.cluster_id)}</h2><p>${x.accounts.map(a=>`<span class=tag>${esc(a)}</span>`).join('')}</p><h3>Score breakdown</h3><p>${Object.entries(x.scores).map(([k,v])=>`${esc(k)}: <b>${v.toFixed(2)}</b>`).join(' · ')}</p><h3>Timeline (one-minute buckets)</h3>${empty(x.timeline.map(b=>`<p><small>${esc(new Date(b.timestamp).toLocaleString())}</small><br><i class=bar style="width:${Math.round(100*b.event_count/max)}%"></i> ${b.event_count}</p>`),'No retained timeline events')}<h3>Interaction graph edges</h3>${empty(x.graph_edges.map(e=>`<p>${esc(e.source)} → ${esc(e.target)} <b>×${e.event_count}</b></p>`),'No directed target edges')}<h3>Common evidence</h3><p>Targets: ${esc(x.common_targets.join(', ')||'none')}<br>URLs: ${esc(x.common_urls.join(', ')||'none')}<br>Median timing difference: ${fmt(x.median_timing_difference_ms)} ms · repeated content: ${x.repeated_content_count}</p><h3>Sample events</h3><pre>${esc(x.sample_events.map(e=>`${e.timestamp} ${e.actor_did} ${e.kind} ${e.target||''}`).join('\n'))}</pre>`;detail.showModal()}
async function tick(){try{let [r,d,p,g,c,a,s]=await Promise.all([f('/api/stats'),f('/api/trending/domains'),f('/api/trending/fingerprints'),f('/api/trending/conversations'),f('/api/clusters'),f('/api/anomalies'),f('/api/storage')]);rates.innerHTML=[['Events/s',r.events_per_sec],['Posts/s',r.posts_per_sec],['Likes/s',r.likes_per_sec],['Follows/s',r.follows_per_sec]].map(x=>`<div class=card><small>${x[0]}</small><div class=num>${x[1].toFixed(2)}</div></div>`).join('');domains.innerHTML=empty(d.slice(0,10).map(x=>`<p>${esc(x[0])} <b>${x[1]}</b></p>`),'Waiting for events…');fingerprints.innerHTML=empty(p.slice(0,10).map(x=>`<p title="${esc(x.key)}">${esc(x.sample||x.key)} <b>${x.count}</b></p>`),'Waiting for posts…');conversations.innerHTML=empty(g.slice(0,10).map(x=>`<p>${esc(x.key)} <b>+${x.growth}</b> (${x.recent_count} recent)</p>`),'Waiting for replies…');storage.innerHTML=`Archive ${fmt(s.raw_archive_bytes)} B<br>ClickHouse ${fmt(s.clickhouse_bytes)} B<br>Derived ${fmt(s.derived_bytes)} B<br>Observed/day ${fmt(s.bytes_ingested_per_day)} B<br>Projected/month ${fmt(s.projected_monthly_bytes)} B`;clusters.innerHTML=`<table><tr><th>Cluster</th><th>Accounts</th><th>Events</th><th>Score</th><th>Evidence</th></tr>${clusterRows(c)}</table>`;posting.innerHTML=empty(a.unusual_posting.map(x=>`<p>${esc(x.did)} <b>${x.automation_score.toFixed(2)}</b> · ${x.events_24h} events</p>`),'No current posting-rate anomalies');campaigns.innerHTML=empty(a.repeated_content_campaigns.map(x=>`<p><button onclick="showCluster('${encodeURIComponent(x.cluster_id)}')">${esc(x.cluster_id)}</button> · ${x.repeated_content_count} matches</p>`),'No repeated-content campaigns')}catch(e){console.error(e)}}tick();setInterval(tick,3000)
</script></body></html>
