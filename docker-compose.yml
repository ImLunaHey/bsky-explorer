services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: observatory
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - ${STORAGE_ROOT:-/mnt/storage/bsky-observatory}/clickhouse:/var/lib/clickhouse
      - ./migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 20
  ingester:
    image: ${INGESTER_IMAGE:-bsky-explorer-ingester:local}
    build:
      context: .
      target: runtime
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
    environment: &app-environment
      SERVICE_ROLE: ingester
      JETSTREAM_URL: ${JETSTREAM_URL:-wss://jetstream2.us-east.bsky.network/subscribe}
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DATABASE: observatory
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      DATA_DIR: /data/archive
      BACKFILL_QUEUE_DIR: /data/archive/backfill-queue
      BACKFILL_WORKER_CONCURRENCY: ${BACKFILL_WORKER_CONCURRENCY:-1}
      STORAGE_BUDGET_TIB: ${STORAGE_BUDGET_TIB:-25}
      STORAGE_BUDGET_BYTES: ${STORAGE_BUDGET_BYTES:-0}
      WEB_DIST_DIR: /usr/share/bsky-observatory
      ARCHIVE_RETENTION_DAYS: ${ARCHIVE_RETENTION_DAYS:-0}
      ARCHIVE_SEGMENT_MIB: ${ARCHIVE_SEGMENT_MIB:-256}
      WINDOWS_SECONDS: ${WINDOWS_SECONDS:-60,300,3600,86400}
      COORDINATION_WINDOW_SECONDS: ${COORDINATION_WINDOW_SECONDS:-30}
      ANALYSIS_MAX_LAG_SECONDS: ${ANALYSIS_MAX_LAG_SECONDS:-10}
      MIN_CLUSTER_ACCOUNTS: ${MIN_CLUSTER_ACCOUNTS:-3}
      MIN_CLUSTER_EVENTS: ${MIN_CLUSTER_EVENTS:-3}
      STATE_RETENTION_HOURS: ${STATE_RETENTION_HOURS:-24}
      HOT_DETAIL_RETENTION_SECONDS: ${HOT_DETAIL_RETENTION_SECONDS:-3600}
      HOT_DETAIL_MAX_EVENTS: ${HOT_DETAIL_MAX_EVENTS:-250000}
      COMMUNITY_WINDOWS_SECONDS: ${COMMUNITY_WINDOWS_SECONDS:-3600,86400,604800}
      COMMUNITY_EVENT_TYPES: ${COMMUNITY_EVENT_TYPES:-like,repost,follow,reply,quote}
      COMMUNITY_MIN_EDGE_WEIGHT: ${COMMUNITY_MIN_EDGE_WEIGHT:-2}
      COMMUNITY_MAX_NODES: ${COMMUNITY_MAX_NODES:-50000}
      COMMUNITY_MAX_EDGES: ${COMMUNITY_MAX_EDGES:-250000}
      COMMUNITY_MAX_INPUT_ROWS: ${COMMUNITY_MAX_INPUT_ROWS:-2000000}
      COMMUNITY_INTERVAL_SECONDS: ${COMMUNITY_INTERVAL_SECONDS:-900}
      CLICKHOUSE_BATCH_SIZE: ${CLICKHOUSE_BATCH_SIZE:-1000}
      CLICKHOUSE_FLUSH_SECONDS: ${CLICKHOUSE_FLUSH_SECONDS:-2}
      IDENTITY_PROFILE_ENDPOINT: ${IDENTITY_PROFILE_ENDPOINT:-https://public.api.bsky.app/xrpc/app.bsky.actor.getProfile}
      IDENTITY_CACHE_CAPACITY: ${IDENTITY_CACHE_CAPACITY:-100000}
      IDENTITY_CACHE_TTL_SECONDS: ${IDENTITY_CACHE_TTL_SECONDS:-21600}
      IDENTITY_NEGATIVE_TTL_SECONDS: ${IDENTITY_NEGATIVE_TTL_SECONDS:-300}
      IDENTITY_REQUESTS_PER_SECOND: ${IDENTITY_REQUESTS_PER_SECOND:-2}
      IDENTITY_QUEUE_DIR: /data/archive/identity-queue
      IDENTITY_QUEUE_CAPACITY: ${IDENTITY_QUEUE_CAPACITY:-1000000}
      IDENTITY_WORKER_CONCURRENCY: ${IDENTITY_WORKER_CONCURRENCY:-1}
      RUST_LOG: bsky_observatory=info,tower_http=info
    volumes:
      - ${ARCHIVE_ROOT:-${STORAGE_ROOT:-/mnt/storage/bsky-observatory}/archive}:/data/archive
    expose:
      - "3000"
  api:
    image: ${API_IMAGE:-bsky-explorer-api:local}
    build:
      context: .
      target: runtime
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      <<: *app-environment
      SERVICE_ROLE: api
      INGESTER_URL: http://ingester:3000
    volumes:
      - ${ARCHIVE_ROOT:-${STORAGE_ROOT:-/mnt/storage/bsky-observatory}/archive}:/data/archive
    expose:
      - "3000"
  enrichment:
    image: ${ENRICHMENT_IMAGE:-bsky-explorer-enrichment:local}
    build:
      context: .
      target: runtime
    entrypoint: ["enrich_collections"]
    restart: unless-stopped
    mem_limit: 1536m
    cpus: 1.0
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DATABASE: observatory
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      RUST_LOG: bsky_observatory=info,enrich_collections=info
    healthcheck:
      test: ["CMD-SHELL", "test -n \"$$(find /tmp/enrichment-ready -mmin -30 2>/dev/null)\""]
      interval: 30s
      timeout: 3s
      start_period: 120s
      retries: 3
  frontend:
    image: ${FRONTEND_IMAGE:-bsky-explorer-frontend:local}
    build:
      context: .
      target: frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:80"
